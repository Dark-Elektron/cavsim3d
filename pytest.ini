[pytest]
testpaths = tests
pythonpath = .
addopts = -v --tb=short
markers =
    slow: marks tests as slow (heavy 3D solves; deselect with -m "not slow")
    qtem: quasi-TEM/microstrip port tests (deselect with -m "not qtem")
filterwarnings =
    # SWIG-generated types of NGSolve and pythonocc, at import
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
    # the library reports a failed save or load as a warning; in a test it is a failure
    error:Could not:UserWarning
