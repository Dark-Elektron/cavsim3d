[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cavsim3d"
dynamic = ["version"]
description = "3D finite-element simulation and model order reduction of RF structures, built on NGSolve."
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sosoho-Abasi Udongwo", email = "numurho@gmail.com" },
]
keywords = [
    "electromagnetics",
    "finite-element",
    "rf-cavity",
    "model-order-reduction",
    "waveguide",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
    "h5py",
    # caps the BLAS threads for the many small dense solves of reduced models
    "threadpoolctl",
    "ngsolve==6.2.2506",
    # ngsolve 6.2.2506 links libmkl_rt.so.2 (Linux) / mkl_rt.2.dll (Windows).
    # mkl >= 2026 renamed these to .so.3 / mkl_rt.3.dll, so ngsolve's ctypes
    # preload no longer satisfies its DT_NEEDED -> ImportError on import.
    # macOS ngsolve wheels do not link MKL at all.
    'mkl<2026; platform_system != "Darwin"',
    "ipython",
    "ipywidgets",
    # Jupyter front-ends used by the tutorials and by geometry .show():
    #   ipympl                  backs the `%matplotlib widget` backend
    #   webgui-jupyter-widgets  imported by netgen.webgui, which
    #                           cavsim3d.core.em_project imports for Draw();
    #                           ngsolve does not declare it itself
    "ipympl",
    "webgui-jupyter-widgets",
]

# NOTE: pythonocc-core (imported as `OCC`) is a hard runtime requirement of
# cavsim3d.geometry, but it is conda-forge only -- the PyPI name is a
# registration with no uploaded distributions -- so it cannot be listed here.
# Install it first with:  conda install -c conda-forge pythonocc-core

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "build",
]
docs = [
    "mkdocs>=1.5,<2.0",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
]

[project.urls]
Homepage = "https://github.com/Dark-Elektron/cavsim3d"
Documentation = "https://dark-elektron.github.io/cavsim3d/"
Repository = "https://github.com/Dark-Elektron/cavsim3d"
Changelog = "https://github.com/Dark-Elektron/cavsim3d/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "cavsim3d.__version__" }

[tool.setuptools.packages.find]
include = ["cavsim3d*"]

[tool.setuptools.package-data]
cavsim3d = ["assets/*.svg"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["archive", "docs", "examples", "notebooks", "scripts", "testbench_runs"]

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports/variables, ...) and syntax errors.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# re-exported names
"**/__init__.py" = ["F401"]
