site_name: cavsim3d
site_description: 3D Cavity Simulation and Model Order Reduction
site_url: !ENV [SITE_URL, "https://dark-elektron.github.io/cavsim3d/"]
repo_url: https://github.com/Dark-Elektron/cavsim3d
repo_name: Dark-Elektron/cavsim3d

# project folders written by running the tutorial notebooks (gitignored too)
exclude_docs: |
  simulations/

theme:
  name: material
  logo: assets/cavsim3d_logo_square.svg
  favicon: assets/cavsim3d_logo_square.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.footnote.tooltips

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
  - mkdocs-jupyter:
      include_source: true
      execute: false
      include_requirejs: true
      kernel_name: python3

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - footnotes
  - attr_list
  - def_list
  - tables
  - md_in_html

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Tutorials:
      - tutorials/index.md
      - Quick run:
          - tutorials/quick_run/index.md
          - "Results from a CST model": tutorials/quick_run/quick_run.ipynb
      - Basics:
          - tutorials/basics/index.md
          - "Your first simulation": tutorials/basics/first_simulation.ipynb
          - "Build a reduced-order model": tutorials/basics/reduced_order_model.ipynb
          - "Find resonances and look at fields": tutorials/basics/resonances_and_fields.ipynb
      - Building models:
          - tutorials/models/index.md
          - "Build cavities from parameters": tutorials/models/parametric_geometries.ipynb
          - "Import a CAD model": tutorials/models/cad_import.ipynb
          - "Cut a model into domains": tutorials/models/splitting_cad.ipynb
          - "Fill a waveguide with lossy material": tutorials/models/materials_and_losses.ipynb
      - Models of several parts:
          - tutorials/multi_part/index.md
          - "Join parts into one model": tutorials/multi_part/combine_parts.ipynb
          - "Repeat a section": tutorials/multi_part/repeated_sections.ipynb
          - "Reuse a solved project": tutorials/multi_part/reuse_projects.ipynb
      - Ports and port modes:
          - tutorials/ports/index.md
          - "Carry several modes per port": tutorials/ports/multimode_ports.ipynb
          - "Coaxial line with a dielectric window": tutorials/tem_transmission_line.ipynb
      - Beams:
          - tutorials/beam/index.md
          - "Compute a beam impedance": tutorials/beam/collimator_impedance.ipynb
          - "Add a beam to a solved cavity": tutorials/beam/beam_on_solved_cavity.ipynb
          - "Beam past a lossy absorber": tutorials/beam/lossy_absorber.ipynb
          - "Join parts with a beam": tutorials/beam/beam_through_parts.ipynb
          - "Beam impedance of the TESLA cavity": tutorials/beam/tesla_beam_impedance.ipynb
      - Applications:
          - tutorials/applications/index.md
          - "TESLA 9-cell cavity chain": tutorials/tesla_cavity_chain.ipynb
          - "C3794 two-cavity module vs CST": tutorials/benchmarks/c3794_cavity_module.ipynb
          - "Cavity figures of merit: validation": tutorials/benchmarks/figures_of_merit.ipynb
  - How-to guides:
      - how-to/index.md
      - Import a CAD file: how-to/import_cad.md
      - Assign materials: how-to/materials.md
      - Chain and arrange parts: how-to/chain_parts.md
      - Choose the mesh size and element order: how-to/mesh_and_order.md
      - Set up port modes: how-to/port_modes.md
      - Model a microstrip line: how-to/microstrip.md
      - Run large models: how-to/large_models.md
      - Control recomputation and resume a sweep: how-to/rerun_and_resume.md
      - Build a reliable reduced model: how-to/reduce_well.md
      - Get the figures of merit of resonances: how-to/resonance_figures.md
      - Compute the beam impedance: how-to/beam_impedance.md
      - Compare with CST Studio Suite: how-to/compare_with_cst.md
      - Export results: how-to/export_results.md
      - Reuse and share projects: how-to/reuse_and_share.md
  - Explanation:
      - explanation/index.md
      - How a model is solved in pieces: explanation/architecture.md
      - How model order reduction works: explanation/model_reduction.md
      - Ports and port modes: explanation/ports.md
      - Parts, joins and netlists: explanation/parts_and_joins.md
      - The project folder: explanation/project_layout.md
  - Mathematical Theory:
      - theory/index.md
      - "1. Maxwell's equations": theory/maxwell.md
      - "2. Variational formulation": theory/variational.md
      - "3. Port modes": theory/ports.md
      - "4. Z-parameters": theory/z_parameters.md
      - "5. Reference impedances and S-parameters": theory/s_parameters.md
      - "6. Model order reduction": theory/reduction.md
      - "7. Concatenation": theory/concatenation.md
      - "8. Resonant modes": theory/resonances.md
      - "9. Beam excitation": theory/beam.md
  - Reference:
      - reference/index.md
      - solve() options: reference/solve_options.md
      - Results: reference/results.md
      - Project folder: reference/project_folder.md
      - API:
          - Project Management: api/project.md
          - Geometry & Assembly: api/geometry.md
          - Solvers & Results: api/solvers.md
          - Model Reduction: api/rom.md
          - Analysis & Comparison: api/analysis.md
  - Developers:
      - Viewing Locally: viewing_locally.md
