# Optional: deploy the app to an ngapp platform instance.
# Mirrors the CERBSim template; fill in the secrets/URL when (if) the bench
# should be published. Local use never needs this file.
name: deploy
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ngapp
      - run: echo "configure 'ngapp deploy' with your platform credentials here"
