name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v5

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          activate-environment: cavsim3d
          miniforge-version: latest

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          # pythonocc-core has NO PyPI distribution, so it must come from
          # conda-forge (it brings its own occt).
          conda install -y -c conda-forge pythonocc-core pythreejs
          # ngsolve is NOT packaged on conda-forge -- only the stale, abandoned
          # `ngsolve` channel (6.2.2201, 2022) has it, hence the previous
          # PackagesNotFoundInChannelsError. Use the official PyPI wheels:
          # 6.2.2506 ships cp39-cp313 for linux/macOS/Windows and pulls in
          # netgen-mesher + netgen-occt AND the `mkl` runtime (the wheel
          # declares it), so libmkl_rt is present. This mirrors the local dev
          # environment: pip ngsolve + conda-forge pythonocc-core.
          # NOTE: ngsolve >= 6.2.2606 requires Python >= 3.10; bumping the pin
          # in setup.py means dropping 3.9 from the matrix below.
          pip install -e .
          pip install pytest pytest-cov


      - name: Run tests
        shell: bash -el {0}
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          set -o pipefail
          pytest -v --tb=short 2>&1 | tee pytest-output.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-output.log