name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v5

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          activate-environment: cavsim3d
          miniforge-version: latest

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          # Install ngsolve + pythonocc-core from conda-forge: ngsolve pulls in
          # MKL (libmkl_rt) and netgen and is ABI-matched to the conda OCC. The
          # PyPI ngsolve wheel needs libmkl_rt.so.2, which is absent otherwise
          # -> ImportError at collection.
          conda install -y -c conda-forge ngsolve pythonocc-core pythreejs ipywidgets
          # Editable install WITHOUT deps so pip does not replace the conda
          # ngsolve with an MKL-less PyPI build; then the pure-Python deps.
          pip install -e . --no-deps
          pip install matplotlib scipy tqdm termcolor h5py gmsh ipython pytest pytest-cov


      - name: Run tests
        shell: bash -el {0}
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          set -o pipefail
          pytest -v --tb=short 2>&1 | tee pytest-output.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-output.log