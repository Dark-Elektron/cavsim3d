name: Deploy Documentation to GitHub Pages

# One site holds both branches: master at the root (the published docs) and
# experiment under /experiment/ (a preview). A push to either rebuilds both.
on:
  push:
    branches: [master, main, experiment]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          path: master

      - name: Checkout experiment
        uses: actions/checkout@v4
        # a run started by master still publishes master if experiment is gone
        continue-on-error: ${{ github.ref_name != 'experiment' }}
        with:
          ref: experiment
          path: experiment

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install documentation dependencies
        run: |
          pip install "mkdocs>=1.5,<2.0" \
                      mkdocs-material \
                      "mkdocstrings[python]" \
                      mkdocs-jupyter

      - name: Build master (published at the site root)
        working-directory: master
        run: mkdocs build --site-dir ../_site

      - name: Build experiment (preview under /experiment/)
        working-directory: experiment
        continue-on-error: ${{ github.ref_name != 'experiment' }}
        env:
          SITE_URL: https://dark-elektron.github.io/cavsim3d/experiment/
        # --strict: a broken link or a missing page fails the build
        run: mkdocs build --strict --site-dir ../_site/experiment

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
